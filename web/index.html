<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ElementFlow converts HTML and CSS into Flutter widgets and exports a single Dart file. From HTML to Flutter. Seamlessly. Runs entirely in your browser.">
  <meta name="theme-color" content="#0B0E14">
  <meta name="color-scheme" content="dark">

  <!-- Social previews -->
  <meta property="og:title" content="ElementFlow — From HTML to Flutter. Seamlessly.">
  <meta property="og:description" content="Paste HTML, preview it, and get Flutter widgets plus a single self-contained Dart file. No backend, no sign-up.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ElementFlow">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ElementFlow — From HTML to Flutter. Seamlessly.</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B0E14; }
    #ef-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #0B0E14; color: #8B93A5;
      font: 500 13px system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity .3s ease; z-index: 10;
    }
    #ef-loading .logo {
      width: 44px; height: 44px; border-radius: 13px;
      background: linear-gradient(135deg, #7C83FF, #4F46E5);
      box-shadow: 0 0 24px rgba(99, 102, 241, .5);
      animation: ef-pulse 1.4s ease-in-out infinite;
    }
    @keyframes ef-pulse { 50% { transform: scale(.88); opacity: .7; } }
  </style>
</head>
<body>
  <div id="ef-loading"><div class="logo"></div>Loading ElementFlow…</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('ef-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
